<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bulle">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#F2F3F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D0F16" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html,body{margin:0}</style>
<title>Bulle TOEIC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: iOS-style single column, large title, colored deck tiles in a 2-col grid, fixed tab bar. Motif: TOEIC answer-sheet bubbles (A B C D). */
:root{
  --bg:#F2F3F7; --card:#FFFFFF; --ink:#151826; --muted:#6B7084; --line:#E3E5EC; --soft:#ECEEF4;
  --accent:#2B4EF0; --accent-soft:#E4E9FF; --sun:#FFC93C;
  --good:#1F9D60; --mid:#D98A00; --bad:#E5484D;
  --l1:#2E9B57; --l2:#2F6AD0; --l3:#C6932A;
  --shadow:0 1px 2px rgba(20,24,40,.05),0 10px 28px rgba(20,24,40,.07);
  --tabbg:rgba(255,255,255,.86);
  --f-display:"Bricolage Grotesque","SF Pro Rounded","Helvetica Neue",Arial,sans-serif;
  --f-body:"Atkinson Hyperlegible",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D0F16; --card:#191C26; --ink:#EEF0F7; --muted:#9097AD; --line:#2A2E3B; --soft:#232736;
  --accent:#5B78FF; --accent-soft:#1E2747; --sun:#FFD15C;
  --good:#3CC584; --mid:#F2AE2E; --bad:#FF6B6E; --l1:#4CC27A; --l2:#6C9BF0; --l3:#E2B44E;
  --shadow:0 1px 0 rgba(255,255,255,.03); --tabbg:rgba(25,28,38,.86); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D0F16; --card:#191C26; --ink:#EEF0F7; --muted:#9097AD; --line:#2A2E3B; --soft:#232736;
  --accent:#5B78FF; --accent-soft:#1E2747; --sun:#FFD15C;
  --good:#3CC584; --mid:#F2AE2E; --bad:#FF6B6E; --l1:#4CC27A; --l2:#6C9BF0; --l3:#E2B44E;
  --shadow:0 1px 0 rgba(255,255,255,.03); --tabbg:rgba(25,28,38,.86); color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 32px}
body.has-tabs{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:default}
button:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:12px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.eyebrow{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.card-s{background:var(--card);border-radius:22px;box-shadow:var(--shadow)}
@keyframes rise{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}
.rise>*{animation:rise .35s cubic-bezier(.2,.7,.2,1) both}
.rise>*:nth-child(2){animation-delay:.04s}.rise>*:nth-child(3){animation-delay:.08s}.rise>*:nth-child(4){animation-delay:.12s}.rise>*:nth-child(5){animation-delay:.16s}

/* header */
.hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:6px}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:46px;height:46px;border-radius:12px;box-shadow:0 4px 14px rgba(43,78,240,.28)}
.brand h1{font-size:1.9rem;font-weight:800;letter-spacing:-.03em;line-height:1}
.brand small{display:block;color:var(--muted);font-size:.82rem;margin-top:3px}
.streak{display:flex;align-items:center;gap:5px;background:var(--card);box-shadow:var(--shadow);border-radius:999px;padding:7px 12px 7px 9px;font-family:var(--f-mono);font-weight:500}
.streak .ic{color:#FF7A1A;width:20px;height:20px;fill:#FFB020;stroke:#FF7A1A}
.streak.off .ic{color:var(--muted);fill:none;stroke:var(--muted)}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:20px;color:#fff;
  background:linear-gradient(150deg,#3D63FF 0%,#2440D8 60%,#1C33B8 100%);box-shadow:0 14px 34px rgba(36,64,216,.28)}
.hero .dots{position:absolute;right:-14px;bottom:62px;display:grid;grid-template-columns:repeat(4,22px);gap:9px;opacity:.13}
.hero .dots i{width:22px;height:22px;border-radius:50%;border:2.5px solid #fff;display:block}
.hero .dots i.f{background:var(--sun);border-color:var(--sun);opacity:1}
.hero-top{display:flex;align-items:center;gap:18px;position:relative}
.ringwrap{position:relative;flex:none;display:grid;place-items:center}
.ringwrap .ctr{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1}
.ringwrap .ctr b{font-family:var(--f-display);font-size:1.7rem;font-weight:800;display:block}
.ringwrap .ctr span{font-size:.7rem;opacity:.8}
.hero h2{font-size:1.35rem;font-weight:800;letter-spacing:-.01em;line-height:1.15}
.hero p{margin:6px 0 0;opacity:.88;font-size:.92rem}
.hero .go{margin-top:18px;width:100%;background:#fff;color:#1C33B8;border-radius:16px;padding:15px;font-weight:700;font-size:1.02rem;display:flex;align-items:center;justify-content:center;gap:8px;position:relative;transition:transform .15s}
.hero .go:active{transform:scale(.98)}
.hero .go:disabled{opacity:.7}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pills span{background:rgba(255,255,255,.16);border-radius:999px;padding:4px 10px;font-size:.8rem;font-weight:700}

/* tiles */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:4px 4px 0}
.sec-h h2{font-size:1.3rem;font-weight:800;letter-spacing:-.02em}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{position:relative;text-align:left;border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:6px;min-height:168px;overflow:hidden;box-shadow:var(--shadow);
  background:radial-gradient(130px 110px at 100% 0%,color-mix(in oklab,var(--deck) 26%,transparent),transparent 70%),var(--card);transition:transform .15s}
.tile:active{transform:scale(.97)}
.chip{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--deck);color:var(--deck-ink,#fff);box-shadow:0 6px 14px color-mix(in oklab,var(--deck) 40%,transparent)}
.tile .tn{font-family:var(--f-display);font-weight:800;font-size:1.02rem;line-height:1.15;margin-top:6px;letter-spacing:-.01em;min-width:0}
.tile .tp{font-size:.74rem;color:var(--muted)}
.tile .foot{margin-top:auto;display:flex;flex-direction:column;gap:5px}
.pbar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;display:flex}
.pbar span{height:100%;display:block}
.pbar .a{background:var(--deck,var(--accent))}.pbar .r{background:var(--deck,var(--accent));opacity:.3}
.tile .tc{font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}
.badge{position:absolute;top:12px;right:12px;background:var(--bad);color:#fff;font-family:var(--f-mono);font-size:.72rem;font-weight:500;min-width:24px;height:24px;border-radius:12px;display:grid;place-items:center;padding:0 7px}
.wide{display:flex;align-items:center;gap:14px;text-align:left;border-radius:22px;padding:14px;box-shadow:var(--shadow);width:100%;
  background:radial-gradient(160px 120px at 100% 0%,color-mix(in oklab,var(--deck) 30%,transparent),transparent 70%),var(--card)}
.wide .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.wide b{font-family:var(--f-display);font-weight:800;font-size:1.08rem}
.wide .tp{font-size:.78rem;color:var(--muted)}
.wide .chev{color:var(--muted)}
.wide .badge{position:static}

/* deck page */
.topnav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.backbtn{display:flex;align-items:center;gap:4px;color:var(--accent);font-weight:700;padding:6px 2px}
.dhead{border-radius:26px;padding:20px;background:var(--deck);color:var(--deck-ink,#fff);position:relative;overflow:hidden}
.dhead .wm{position:absolute;right:-20px;top:-22px;width:150px;height:150px;opacity:.16;stroke-width:1.5}
.dhead h2{font-size:1.7rem;font-weight:800;letter-spacing:-.02em;line-height:1.1;position:relative}
.dhead .tp{opacity:.85;font-size:.88rem;margin-top:4px;position:relative}
.dstats{display:flex;gap:22px;margin-top:16px;position:relative}
.dstats b{font-family:var(--f-display);font-size:1.6rem;font-weight:800;display:block;line-height:1}
.dstats span{font-size:.76rem;opacity:.85}
.dbtns{display:grid;grid-template-columns:1.4fr 1fr;gap:10px;margin-top:18px;position:relative}
.dbtns button{border-radius:14px;padding:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:7px}
.dbtns .p{background:#fff;color:#151826}
.dbtns .s{background:rgba(255,255,255,.2);color:inherit}
.wlist{padding:4px 16px}
.wrow{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.wrow:first-child{border-top:0}
.wrow .dot{width:10px;height:10px;border-radius:50%;background:var(--soft);border:2px solid var(--line)}
.wrow .dot.s0{background:var(--bad);border-color:var(--bad)}.wrow .dot.s1{background:var(--mid);border-color:var(--mid)}.wrow .dot.s2{background:var(--good);border-color:var(--good)}
.wrow b{min-width:0;overflow-wrap:anywhere}
.wrow small{grid-column:2;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.lv{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:.66rem;color:var(--muted);white-space:nowrap}
.lv i{width:8px;height:8px;border-radius:50%;display:inline-block}
.lv.l1 i{background:var(--l1)}.lv.l2 i{background:var(--l2)}.lv.l3 i{background:var(--l3)}.lv.l0 i{background:var(--sun)}
.wrow .lv{grid-row:1/3;grid-column:3}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.76rem;color:var(--muted);padding:0 4px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}

/* study */
.sbar{display:flex;align-items:center;gap:12px;padding-top:4px}
.xbtn{width:38px;height:38px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;flex:none;color:var(--muted)}
.prog{flex:1;height:10px;border-radius:5px;background:var(--soft);overflow:hidden}
.prog span{display:block;height:100%;border-radius:5px;background:var(--accent);transition:width .35s}
.scount{font-family:var(--f-mono);font-size:.82rem;color:var(--muted)}
.swiper{position:relative;touch-action:pan-y;transition:transform .3s cubic-bezier(.2,.7,.2,1);user-select:none;-webkit-user-select:none}
.stamp{position:absolute;top:22px;z-index:3;font-family:var(--f-display);font-weight:800;font-size:1.05rem;letter-spacing:.04em;padding:6px 12px;border-radius:10px;border:3px solid;opacity:0;transition:opacity .12s;pointer-events:none;background:var(--card)}
.stamp.g{left:20px;color:var(--good);transform:rotate(-12deg)}
.stamp.b{right:20px;color:var(--bad);transform:rotate(12deg)}
.swiper[data-hint="good"] .stamp.g,.swiper[data-hint="bad"] .stamp.b{opacity:1}
.flip{perspective:1600px}
.card{display:grid;min-height:min(62vh,440px);transition:transform .5s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d;cursor:pointer;border-radius:28px}
.card.flipped{transform:rotateY(180deg);cursor:grab}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.face.front{background:var(--deck);color:var(--deck-ink,#fff);box-shadow:0 18px 40px color-mix(in oklab,var(--deck) 35%,transparent)}
.face.front .wm{position:absolute;right:-30px;bottom:-30px;width:200px;height:200px;opacity:.14;stroke-width:1.4}
.face.back{transform:rotateY(180deg);background:var(--card);box-shadow:var(--shadow);border-top:8px solid var(--deck)}
.fhead{display:flex;justify-content:space-between;align-items:center;gap:10px;position:relative}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:700;border-radius:999px;padding:5px 10px;background:rgba(255,255,255,.2)}
.tag i{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.back .tag{background:var(--soft);color:var(--muted)}
.fbody{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;position:relative;padding:8px 0}
.fbody .dir{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.word{font-family:var(--f-display);font-weight:800;font-size:clamp(2rem,9vw,2.9rem);line-height:1.05;letter-spacing:-.025em;overflow-wrap:anywhere;text-wrap:balance}
.word.long{font-size:clamp(1.5rem,6.5vw,2rem)}
.q-small{font-family:var(--f-mono);font-size:.82rem;color:var(--muted)}
.ex{background:var(--soft);border-radius:14px;padding:12px 14px;font-style:italic;color:var(--ink);font-size:.95rem;position:relative}
.ex::before{content:"“";position:absolute;left:10px;top:-8px;font-family:var(--f-display);font-size:2rem;color:var(--deck);font-style:normal}
.ex{padding-left:22px}
.rule{background:var(--accent-soft);border-radius:14px;padding:12px 14px;font-size:.92rem;display:flex;gap:10px}
.rule .ic{color:var(--accent);width:20px;height:20px;margin-top:1px}
.taphint{text-align:center;font-size:.8rem;opacity:.75;position:relative}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grades button{border-radius:18px;padding:12px 6px 10px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;transition:transform .12s}
.grades button:active{transform:scale(.95)}
.grades small{font-family:var(--f-mono);font-weight:500;font-size:.68rem;opacity:.8}
.grades .g0{background:color-mix(in oklab,var(--bad) 16%,var(--card));color:var(--bad)}
.grades .g1{background:color-mix(in oklab,var(--mid) 18%,var(--card));color:var(--mid)}
.grades .g2{background:color-mix(in oklab,var(--good) 16%,var(--card));color:var(--good)}
.bigbtn{width:100%;border-radius:18px;padding:16px;font-weight:700;font-size:1.02rem;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s}
.bigbtn:active{transform:scale(.98)}
.bigbtn.alt{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.swipehint{text-align:center;font-size:.78rem;color:var(--muted)}
.done{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:26px 18px}
.done h2{font-size:1.6rem;font-weight:800;letter-spacing:-.02em}
.tally{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.tally div{border-radius:16px;padding:10px 4px;background:var(--soft)}
.tally b{display:block;font-family:var(--f-display);font-size:1.4rem;font-weight:800}
.tally span{font-size:.74rem;color:var(--muted)}
.tally .a b{color:var(--bad)}.tally .h b{color:var(--mid)}.tally .g b{color:var(--good)}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}

/* quiz */
.qhero{border-radius:26px;padding:22px 20px;background:linear-gradient(160deg,#FFD25E,#FFB72B);color:#2A1E00;position:relative;overflow:hidden}
.qhero h2{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;line-height:1.1;max-width:15ch}
.qhero p{margin:8px 0 0;font-size:.92rem;max-width:30ch}
.sheet{position:absolute;right:16px;top:18px;display:flex;flex-direction:column;gap:8px}
.sheet div{display:flex;gap:6px}
.sheet i{width:20px;height:20px;border-radius:50%;border:2.5px solid #2A1E00;opacity:.55;display:block}
.sheet i.f{background:#2A1E00;opacity:.85}
.dpick{display:flex;flex-wrap:wrap;gap:8px}
.dpick button{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:8px 12px 8px 8px;background:var(--card);box-shadow:var(--shadow);font-size:.86rem;font-weight:700}
.dpick button i{width:20px;height:20px;border-radius:50%;background:var(--deck);display:block}
.dpick button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.qcard{border-radius:26px;padding:20px;background:var(--deck);color:var(--deck-ink,#fff);min-height:170px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.qcard .wm{position:absolute;right:-24px;bottom:-24px;width:140px;height:140px;opacity:.15;stroke-width:1.4}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;background:var(--card);box-shadow:var(--shadow);border-radius:18px;padding:12px 14px;width:100%;border:2px solid transparent;transition:transform .12s}
.opt:active{transform:scale(.98)}
.bub{flex:none;width:34px;height:34px;border-radius:50%;border:2.5px solid var(--muted);display:grid;place-items:center;font-family:var(--f-mono);font-size:.85rem;color:var(--muted)}
.opt span:last-child{min-width:0;overflow-wrap:anywhere;font-weight:700}
.opt.right{border-color:var(--good);background:color-mix(in oklab,var(--good) 12%,var(--card))}
.opt.right .bub{border-color:var(--good);color:var(--good)}
.opt.right.picked .bub{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:color-mix(in oklab,var(--bad) 12%,var(--card))}
.opt.wrong .bub{background:var(--bad);border-color:var(--bad);color:#fff}
.miss{width:100%;text-align:left;padding:4px 16px}
.miss div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:.92rem}
.miss div:first-child{border-top:0}
.miss b{min-width:0;overflow-wrap:anywhere}.miss span{color:var(--muted);text-align:right;min-width:0}
.note{padding:14px 16px;color:var(--muted);font-size:.92rem}

/* stats */
.sum{display:flex;align-items:center;gap:18px;padding:18px}
.sum h2{font-size:1.25rem;font-weight:800;letter-spacing:-.01em}
.sgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stile{padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.stile .ic{width:22px;height:22px;margin-bottom:6px}
.stile b{font-family:var(--f-display);font-size:1.7rem;font-weight:800;line-height:1.1}
.stile span{font-size:.8rem;color:var(--muted)}
.rings{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:18px 10px;text-align:center}
.rings .ringwrap .ctr b{font-size:1rem}
.rings p{margin:6px 0 0;font-size:.78rem;font-weight:700}
.rings small{display:block;font-family:var(--f-mono);font-size:.62rem;color:var(--muted);font-weight:400}
.chartbox{padding:16px 16px 12px;display:flex;flex-direction:column;gap:8px}
.chart{display:flex;align-items:flex-end;gap:5px;height:130px;padding-top:18px}
.chart div{flex:1;border-radius:6px 6px 3px 3px;background:var(--accent);min-height:3px;position:relative;opacity:.85}
.chart div.z{background:var(--soft);opacity:1}
.chart div.t{opacity:1;background:var(--sun)}
.chart div b{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-family:var(--f-mono);font-size:.6rem;font-weight:500;color:var(--muted)}
.chartx{display:flex;gap:5px;font-family:var(--f-mono);font-size:.6rem;color:var(--muted)}
.chartx span{flex:1;text-align:center}
.hard{padding:4px 16px}
.hard div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:11px 0;border-top:1px solid var(--line)}
.hard div:first-child{border-top:0}
.hard b{overflow-wrap:anywhere}.hard small{color:var(--muted);grid-column:1}
.hard em{font-style:normal;font-family:var(--f-mono);font-size:.72rem;color:var(--bad);background:color-mix(in oklab,var(--bad) 12%,var(--card));border-radius:999px;padding:3px 8px;grid-row:1/3;grid-column:2;align-self:center}

/* settings */
.group{display:flex;flex-direction:column}
.grow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.grow:first-child{border-top:0}
.grow .gl{display:flex;align-items:center;gap:12px;font-weight:700;min-width:0}
.gi{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#fff;flex:none}
.gi .ic{width:19px;height:19px}
.seg{display:inline-flex;background:var(--soft);border-radius:11px;padding:3px;gap:2px}
.seg button{border-radius:9px;padding:6px 11px;font-size:.85rem;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.lvchips{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 14px}
.lvc{display:inline-flex;align-items:center;gap:8px;border-radius:14px;padding:8px 12px 8px 9px;background:var(--soft);font-weight:700;font-size:.86rem;color:var(--muted)}
.lvc i{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--lc);display:grid;place-items:center}
.lvc[aria-pressed="true"]{color:var(--ink);background:color-mix(in oklab,var(--lc) 14%,var(--card))}
.lvc[aria-pressed="true"] i{background:var(--lc)}
.lvc small{font-family:var(--f-mono);font-weight:500;font-size:.68rem;color:var(--muted)}
.txt{padding:0 16px 14px;color:var(--muted);font-size:.88rem;margin:0}
.steps{margin:0;padding:0 16px 16px 36px;color:var(--muted);font-size:.9rem;display:flex;flex-direction:column;gap:4px}
.linkbtn{color:var(--accent);font-weight:700;padding:4px 0}
.dangerbtn{color:var(--bad);font-weight:700}
.foot-note{text-align:center;font-size:.76rem;color:var(--muted);padding:6px}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--tabbg);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);border-top:1px solid var(--line);
  padding:7px max(16px,env(safe-area-inset-left,0px)) calc(7px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.tabbar nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.68rem;font-weight:700;color:var(--muted);padding:4px 0}
.tabbar button[aria-current="page"]{color:var(--accent)}
.tabbar .ic{width:25px;height:25px}

@media (max-width:370px){.grid{gap:10px}.tile{padding:12px}.rings{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){.card,.swiper,.prog span{transition:none}.rise>*{animation:none}}

};
function ic(n,cls){return `<svg class="ic ${cls||''}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]||''}</svg>`;}
function LOGO(rx){return `<svg viewBox="0 0 512 512" aria-hidden="true"><defs><linearGradient id="lgbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4469FF"/><stop offset="1" stop-color="#1C33C4"/></linearGradient></defs><rect width="512" height="512" rx="${rx==null?112:rx}" fill="url(#lgbg)"/><g transform="rotate(-11 256 272)"><rect x="128" y="120" width="236" height="300" rx="38" fill="#8EAEFF"/></g><g transform="rotate(7 268 268)"><rect x="150" y="112" width="236" height="300" rx="38" fill="#FFFFFF"/><rect x="190" y="168" width="156" height="24" rx="12" fill="#D7E0FF"/><rect x="190" y="212" width="104" height="24" rx="12" fill="#D7E0FF"/><circle cx="212" cy="336" r="22" fill="none" stroke="#2440D8" stroke-width="9"/><circle cx="268" cy="336" r="22" fill="#FFC93C" stroke="#2440D8" stroke-width="9"/><circle cx="324" cy="336" r="22" fill="none" stroke="#2440D8" stroke-width="9"/></g></svg>`;}

const DECK_STYLE={mine:['#F5B700','bookmark','#1E1A0A'],office:['#3B6CF6','briefcase'],hr:['#EF6A4C','people'],finance:['#14A06B','coins'],purchasing:['#E39500','cart'],sales:['#DB4C8F','megaphone'],travel:['#1AA3D9','plane'],hotel:['#E5822F','fork'],property:['#7C5CE0','building'],photo:['#23A99A','camera'],production:['#5D6B82','box'],tech:['#4357D9','laptop'],health:['#DD3F5A','heart'],phrasal:['#9A57D1','arrow'],linkers:['#0F97A8','link'],falsefriends:['#C9622B','swap'],formal:['#34406A','pen'],all:['#2B4EF0','layers'],weak:['#E5484D','target']};
function ds(k){const s=DECK_STYLE[k]||DECK_STYLE.all;return {c:s[0],i:s[1],ink:s[2]||'#FFFFFF'};}
function dvars(k){const d=ds(k);return `--deck:${d.c};--deck-ink:${d.ink}`;}

const LEVELS={0:{name:'Mes mots',cls:'l0',range:'Notion'},1:{name:'Bases',range:'470–725',cls:'l1'},2:{name:'Avancé',range:'730–855',cls:'l2'},3:{name:'Expert',range:'860–990',cls:'l3'}};
const INTERVALS=[0,1,3,7,16,35];
const ACQUIRED=4;

/* ---------- Cards ---------- */
function hash(s){let h=2166136261;for(const ch of s){h^=ch.codePointAt(0);h=Math.imul(h,16777619);}return (h>>>0).toString(36);}
const CARDS=[],BY_ID={},DECK_MAP={};
DECKS.forEach(d=>{
  d.cards=[];DECK_MAP[d.k]=d;const seen=new Set();
  d.w.trim().split('\n').forEach(line=>{
    const [en,fr,l,ex]=line.split('|').map(s=>(s||'').trim());if(!en||!fr)return;
    const id='c'+hash(d.k+':'+en.toLowerCase());if(seen.has(id))return;seen.add(id);
    const c={id,deck:d.k,en,fr,lvl:+l||1,ex:ex||'',note:'',type:''};d.cards.push(c);CARDS.push(c);BY_ID[id]=c;
  });
});
const MINE={k:'mine',n:'Mes mots',p:'Ta base Notion',cards:[]};DECK_MAP.mine=MINE;
function rebuildMine(){
  MINE.cards.forEach(c=>{delete BY_ID[c.id];});MINE.cards=[];const seen=new Set();
  (S.notion||NOTION_FALLBACK).forEach(r=>{const [en,fr,type,ex,note]=r;if(!en)return;const id='n'+hash(en.toLowerCase());if(seen.has(id))return;seen.add(id);
    const c={id,deck:'mine',en,fr:fr||'(pas de traduction dans Notion)',lvl:0,ex:ex||'',note:note||'',type:type||''};MINE.cards.push(c);BY_ID[id]=c;});
}

/* ---------- State ---------- */
const LS_KEY='toeic-flashcards-v1';
function defaultState(){return {v:1,cards:{},days:{},settings:{dir:'en',levels:[1,2,3],newPer:15,goal:20},notion:null,notionAt:0,updatedAt:0};}
function normalize(p){const s=Object.assign(defaultState(),p||{});s.settings=Object.assign(defaultState().settings,s.settings||{});if(!Array.isArray(s.settings.levels)||!s.settings.levels.length)s.settings.levels=[1,2,3];s.cards=s.cards||{};s.days=s.days||{};return s;}
let S=defaultState();
try{const raw=localStorage.getItem(LS_KEY);if(raw){const p=JSON.parse(raw);if(p&&p.v===1)S=normalize(p);}}catch(e){}
rebuildMine();
const IN_CLAUDE=!!(window.claude&&typeof window.claude.use==='function');
const remote={ref:null,writing:false,pending:false,timer:0};
function save(){
  S.updatedAt=Date.now();
  try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){}
  if(remote.ref){clearTimeout(remote.timer);remote.timer=setTimeout(flushRemote,2000);}
}
async function flushRemote(){
  if(!remote.ref)return;if(remote.writing){remote.pending=true;return;}
  remote.writing=true;
  try{await remote.ref.set(JSON.parse(JSON.stringify(S)));}catch(e){}
  finally{remote.writing=false;if(remote.pending){remote.pending=false;flushRemote();}}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&remote.timer){clearTimeout(remote.timer);remote.timer=0;flushRemote();}});
async function initRemote(){
  if(!IN_CLAUDE)return;
  try{
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user)return;const uid=await user.id();if(!uid)return;
    const ref=db.doc('data/users/'+uid+'/progress');const snap=await ref.get();remote.ref=ref;
    if(snap.exists){const d=snap.data();
      if(d&&d.v===1&&(d.updatedAt||0)>(S.updatedAt||0)){
        if(!session&&!quiz){S=normalize(JSON.parse(JSON.stringify(d)));try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){}rebuildMine();render();}
      } else if((S.updatedAt||0)>((d&&d.updatedAt)||0)) flushRemote();
    } else if(S.updatedAt) flushRemote();
  }catch(e){}
}

/* ---------- Helpers ---------- */
const $=id=>document.getElementById(id);
function dayNum(d=new Date()){return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/86400000);}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function allCards(){return MINE.cards.concat(CARDS);}
function deckCards(k){return k==='all'?allCards():(DECK_MAP[k]?DECK_MAP[k].cards:[]);}
function filtered(cs){const L=S.settings.levels;return cs.filter(c=>c.lvl===0||L.includes(c.lvl));}
function st(c){return S.cards[c.id];}
function isDue(c,t){const s=st(c);return !!s&&s[1]<=t;}
function deckName(k){return k==='all'?'Toutes les listes':k==='weak'?'Mots fragiles':(DECK_MAP[k]?DECK_MAP[k].n:'');}
function streak(){let t=dayNum();if(!S.days[t])t--;let n=0;while(S.days[t]){n++;t--;}return n;}
function plural(n,w,ws){return n+' '+(n>1?(ws||w+'s'):w);}
function status(c){const s=st(c);if(!s)return 'new';if(s[0]>=ACQUIRED)return 's2';if(s[0]===0)return 's0';return 's1';}
function lvTag(c){const L=LEVELS[c.lvl];return `<span class="lv ${L.cls}"><i></i>${c.lvl===0?esc(c.type||'Mes mots'):L.name}</span>`;}
function ring(p,size,sw,col,track){const r=(size-sw)/2,C=2*Math.PI*r,h=size/2;p=Math.max(0,Math.min(1,p||0));
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${h}" cy="${h}" r="${r}" fill="none" style="stroke:${track}" stroke-width="${sw}"/><circle cx="${h}" cy="${h}" r="${r}" fill="none" style="stroke:${col}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${(C*(1-p)).toFixed(2)}" transform="rotate(-90 ${h} ${h})"/></svg>`;}
function deckCounts(cs,t){let acq=0,lrn=0,due=0;cs.forEach(c=>{const s=st(c);if(s){if(s[0]>=ACQUIRED)acq++;else lrn++;if(s[1]<=t)due++;}});return {acq,lrn,due,n:cs.length};}

/* ---------- Routing ---------- */
let route={v:'home'},session=null,quiz=null,quizDeck='all',quizMsg='',resetAsk=false,notionMsg='';
function go(v,extra){route=Object.assign({v},extra||{});if(v!=='study')session=null;if(v!=='quiz')quiz=null;resetAsk=false;render();window.scrollTo(0,0);}
function render(){
  const m=$('main');

  $('tabbar').hidden=!tabs;document.body.classList.toggle('has-tabs',tabs);
  const cur=route.v==='deck'?'home':route.v;
  document.querySelectorAll('.tabbar button').forEach(b=>{if(b.dataset.tab===cur)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});

document.querySelectorAll('.tabbar button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.tab)));

/* ---------- Home ---------- */

    <div class="hero-top">

      <div style="min-width:0"><div class="eyebrow" style="color:rgba(255,255,255,.75)">${esc(date)}</div><h2>${headline}</h2><p>${sub}</p></div>
    </div>

  </section>

      <span class="pbar"><span class="a" style="width:${mc.n?mc.acq/mc.n*100:0}%"></span><span class="r" style="width:${mc.n?mc.lrn/mc.n*100:0}%"></span></span></span>
    ${mc.due?`<span class="badge">${mc.due}</span>`:''}<span class="chev">${ic('chev')}</span>
  </button>
  <div class="sec-h"><h2>Listes thématiques</h2><span class="eyebrow">${CARDS.length} mots</span></div>
  <div class="grid">`;
  DECKS.forEach(d=>{const cs=filtered(d.cards),c=deckCounts(cs,t),st_=ds(d.k);

/* ---------- Deck ---------- */
function vDeck(k){
  const d=DECK_MAP[k];if(!d)return vHome();
  const t=dayNum(),cs=k==='mine'?d.cards:filtered(d.cards),c=deckCounts(cs,t),style=ds(k);
  const fresh=cs.filter(x=>!st(x)).length;
  const order={s0:0,s1:1,new:2,s2:3};
  const rows=cs.slice().sort((a,b)=>order[status(a)]-order[status(b)]||a.lvl-b.lvl);
  return `<div class="topnav"><button class="backbtn" data-act="home">${ic('back')}Listes</button><span class="eyebrow">${esc(d.p)}</span></div>
  <section class="dhead" style="${dvars(k)}">${ic(style.i,'wm')}
    <h2>${esc(d.n)}</h2><div class="tp">${cs.length} mots${k==='mine'?' · synchronisés depuis Notion':''}</div>
    <div class="dstats"><div><b class="mono">${c.acq}</b><span>acquis</span></div><div><b class="mono">${c.due}</b><span>à revoir</span></div><div><b class="mono">${fresh}</b><span>nouveaux</span></div></div>
    <div class="dbtns"><button class="p" data-act="study" data-v="${k}">${ic('play')}Réviser</button><button class="s" data-act="quiz" data-v="${k}">${ic('target')}Quiz</button></div>
  </section>
  <div class="legend"><span><i style="background:var(--bad)"></i>à revoir</span><span><i style="background:var(--mid)"></i>en cours</span><span><i style="background:var(--good)"></i>acquis</span><span><i style="background:var(--soft);border:2px solid var(--line)"></i>jamais vu</span></div>
  <section class="card-s wlist">${rows.map(x=>`<div class="wrow"><span class="dot ${status(x)}"></span><b>${esc(x.en)}</b>${lvTag(x)}<small>${esc(x.fr)}</small></div>`).join('')}</section>`;
}

/* ---------- Study ---------- */
function startSession(k){
  const t=dayNum(),cs=k==='mine'?deckCards(k):filtered(deckCards(k));
  const due=shuffle(cs.filter(c=>isDue(c,t)));
  let nw=cs.filter(c=>!st(c));if(k==='all'){shuffle(nw);}nw.sort((a,b)=>a.lvl-b.lvl);nw=nw.slice(0,S.settings.newPer);
  let q=due.concat(nw).map(c=>c.id),practice=false;
  if(!q.length){practice=true;q=shuffle(cs.slice()).sort((a,b)=>((st(a)||[9])[0])-((st(b)||[9])[0])).slice(0,15).map(c=>c.id);if(!q.length)return;}
  session={k,queue:q,idx:0,total:q.length,flipped:false,tally:[0,0,0],dir:'en',practice,celebrated:false};
  nextDir();route={v:'study'};render();window.scrollTo(0,0);
}
function nextDir(){const d=S.settings.dir;session.dir=d==='mix'?(Math.random()<.5?'en':'fr'):d;session.flipped=false;}
function nextLabel(c,g){const s=st(c);if(g===0)return 'maintenant';if(g===1)return 'demain';const nb=!s?2:Math.min(5,s[0]+1),d=INTERVALS[nb];return d===1?'demain':'dans '+d+' j';}
function vStudy(){
  const s=session;const done=s.tally[1]+s.tally[2];
  const top=`<div class="sbar"><button class="xbtn" data-act="close" aria-label="Quitter la session">${ic('x')}</button>
    <div class="prog"><span style="width:${Math.min(done,s.total)/s.total*100}%"></span></div><span class="scount">${Math.min(done,s.total)}/${s.total}</span></div>`;
  if(s.idx>=s.queue.length){
    const pct=done?Math.round(s.tally[2]/(s.tally[0]+s.tally[1]+s.tally[2])*100):0;
    if(!s.celebrated){s.celebrated=true;setTimeout(confetti,120);}
    return top+`<section class="card-s done">
      <div class="ringwrap">${ring(pct/100,120,12,'var(--good)','var(--soft)')}<div class="ctr"><div><b class="mono" style="color:var(--ink)">${pct}%</b><span class="muted">réussite</span></div></div></div>
      <h2>Session terminée</h2><p class="muted" style="margin:0">${esc(deckName(s.k))} · ${plural(done,'carte révisée','cartes révisées')}</p>
      <div class="tally"><div class="a"><b class="mono">${s.tally[0]}</b><span>à revoir</span></div><div class="h"><b class="mono">${s.tally[1]}</b><span>hésité</span></div><div class="g"><b class="mono">${s.tally[2]}</b><span>su</span></div></div>
      <button class="bigbtn" data-act="close">${ic('check')}Terminer</button>
      <button class="bigbtn alt" data-act="quiz" data-v="${s.k}">${ic('target')}Enchaîner sur un quiz</button>
    </section>`;
  }
  const c=BY_ID[s.queue[s.idx]];if(!c){s.idx++;return vStudy();}
  const front=s.dir==='en'?c.en:c.fr,back=s.dir==='en'?c.fr:c.en,dk=c.deck,style=ds(dk);
  const L=LEVELS[c.lvl];
  return top+`<div class="swiper" id="swiper" style="${dvars(dk)}"><span class="stamp g">JE SAVAIS</span><span class="stamp b">À REVOIR</span>
    <div class="flip"><div class="card${s.flipped?' flipped':''}" id="card" data-act="flip" role="button" tabindex="0" aria-label="${s.flipped?'Carte retournée':'Retourner la carte'}">
      <div class="face front" aria-hidden="${s.flipped}">${ic(style.i,'wm')}
        <div class="fhead"><span class="tag"><i></i>${c.lvl===0?esc(c.type||'Mes mots'):L.name+' · '+L.range}</span><span class="tag">${esc(deckName(dk))}</span></div>
        <div class="fbody"><span class="dir">${s.dir==='en'?'Anglais → français':'Français → anglais'}</span><div class="word${front.length>20?' long':''}">${esc(front)}</div></div>
        <div class="taphint">Touche pour retourner</div>
      </div>
      <div class="face back" aria-hidden="${!s.flipped}">
        <div class="fhead"><span class="q-small">${esc(front)}</span>${lvTag(c)}</div>
        <div class="fbody"><div class="word${back.length>20?' long':''}">${esc(back)}</div>
          ${c.ex?`<div class="ex">${esc(c.ex)}</div>`:''}
          ${c.note?`<div class="rule">${ic('info')}<span>${esc(c.note)}</span></div>`:''}</div>
      </div>
    </div></div></div>
  ${s.flipped?`<div class="grades"><button class="g0" data-act="grade" data-v="0">À revoir<small>${nextLabel(c,0)}</small></button><button class="g1" data-act="grade" data-v="1">Hésité<small>${nextLabel(c,1)}</small></button><button class="g2" data-act="grade" data-v="2">Je savais<small>${nextLabel(c,2)}</small></button></div>
    <p class="swipehint">Ou glisse la carte : à droite si tu savais, à gauche pour la revoir</p>`
  :`<button class="bigbtn" data-act="flip">${ic('rotate')}Voir la réponse</button>`}`;
}
function flip(){
  if(!session||session.idx>=session.queue.length||session.flipped)return;
  session.flipped=true;const card=$('card');if(card)card.classList.add('flipped');
  const rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
  setTimeout(()=>{if(session&&session.flipped){route.anim=false;render();route.anim=true;$('main').classList.remove('rise');}},rm?0:420);
}
function grade(g){
  const s=session;if(!s||!s.flipped)return;const c=BY_ID[s.queue[s.idx]],t=dayNum();
  const prev=st(c),isNew=!prev,n=prev?prev.slice():[0,t,0,0];n[3]=(n[3]||0)+1;
  if(g===0){n[0]=0;n[1]=t;n[2]=(n[2]||0)+1;}else if(g===1){n[0]=Math.max(1,n[0]);n[1]=t+1;}else{n[0]=isNew?2:Math.min(5,n[0]+1);n[1]=t+INTERVALS[n[0]];}
  if(!s.practice||g===0||!prev){S.cards[c.id]=n;}
  S.days[t]=(S.days[t]||0)+1;s.tally[g]++;
  if(g===0){s.queue.splice(Math.min(s.idx+4,s.queue.length),0,c.id);}
  s.idx++;save();nextDir();render();
}
function bindSwipe(){
  const el=$('swiper');if(!el||!session||!session.flipped)return;
  let x0=null,y0=0,dx=0,drag=false;
  el.addEventListener('pointerdown',e=>{x0=e.clientX;y0=e.clientY;dx=0;drag=false;});
  el.addEventListener('pointermove',e=>{if(x0==null)return;dx=e.clientX-x0;const dy=e.clientY-y0;
    if(!drag&&Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)){drag=true;try{el.setPointerCapture(e.pointerId);}catch(_){}el.style.transition='none';}
    if(drag){el.style.transform=`translateX(${dx}px) rotate(${dx/22}deg)`;el.dataset.hint=dx>50?'good':dx<-50?'bad':'';}});
  const end=()=>{if(x0==null)return;x0=null;el.style.transition='';
    if(drag&&Math.abs(dx)>95){const g=dx>0?2:0;el.style.transform=`translateX(${dx>0?'120vw':'-120vw'}) rotate(${dx>0?18:-18}deg)`;setTimeout(()=>grade(g),200);}
    else{el.style.transform='';el.dataset.hint='';}drag=false;};
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
}
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cv=document.createElement('canvas');cv.className='confetti';document.body.appendChild(cv);
  const dpr=window.devicePixelRatio||1,W=innerWidth,H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
  const cols=['#3B6CF6','#FFC93C','#EF6A4C','#14A06B','#DB4C8F','#1AA3D9','#9A57D1'];
  const ps=Array.from({length:130},()=>({x:W/2+(Math.random()-.5)*120,y:H*.32,vx:(Math.random()-.5)*11,vy:-Math.random()*10-4,r:Math.random()*6,vr:(Math.random()-.5)*.35,w:7+Math.random()*6,h:4+Math.random()*4,c:cols[Math.random()*cols.length|0],o:Math.random()<.35}));
  let f=0;(function step(){ctx.clearRect(0,0,W,H);ps.forEach(p=>{p.vy+=.28;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;
    if(p.o){ctx.beginPath();ctx.arc(0,0,p.w/2.3,0,7);ctx.fill();}else ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();});
    if(++f<160)requestAnimationFrame(step);else cv.remove();})();
}

/* ---------- Quiz ---------- */
function startQuiz(k){
  let pool=k==='weak'?filtered(allCards()).filter(c=>{const s=st(c);return s&&s[0]<2;}):(k==='mine'?deckCards(k):filtered(deckCards(k)));
  if(pool.length<4){quiz=null;quizMsg='Pas assez de mots dans cette liste avec tes niveaux. Élargis les niveaux dans Réglages.';route={v:'quiz'};render();return;}
  quizMsg='';const wide=filtered(allCards());
  const items=shuffle(pool.slice()).slice(0,10).map(c=>{
    const dir=S.settings.dir==='mix'?(Math.random()<.5?'en':'fr'):S.settings.dir,key=x=>dir==='en'?x.fr:x.en,right=key(c),used=new Set([right.toLowerCase()]),dis=[];
    for(const src of [shuffle(pool.filter(x=>x!==c&&x.lvl===c.lvl)),shuffle(pool.filter(x=>x!==c)),shuffle(wide.filter(x=>x!==c))]){for(const x of src){if(dis.length>=3)break;const v=key(x);if(!used.has(v.toLowerCase())){used.add(v.toLowerCase());dis.push(v);}}if(dis.length>=3)break;}
    const options=shuffle([right].concat(dis));return {c,dir,options,answer:options.indexOf(right),picked:null};});
  quiz={k,items,i:0,score:0,celebrated:false};route={v:'quiz'};render();window.scrollTo(0,0);
}
function vQuiz(){
  if(!quiz){
    const t=dayNum(),weak=filtered(allCards()).filter(c=>{const s=st(c);return s&&s[0]<2;}).length;
    const opts=[['all','Tout'],['mine','Mes mots']].concat(DECKS.map(d=>[d.k,d.n]));
    return `<div class="sec-h" style="padding-top:8px"><h2 style="font-size:1.9rem">Quiz</h2></div>
    <section class="qhero"><div class="sheet" aria-hidden="true"><div><i></i><i class="f"></i><i></i><i></i></div><div><i></i><i></i><i></i><i class="f"></i></div><div><i class="f"></i><i></i><i></i><i></i></div></div>
      <h2>10 questions, 4 réponses</h2><p>Comme au TOEIC, une seule bonne bulle. Chaque erreur repart dans tes cartes à revoir.</p></section>
    ${quizMsg?`<div class="card-s note">${esc(quizMsg)}</div>`:''}
    <div class="sec-h"><h2 style="font-size:1.1rem">Choisis une liste</h2></div>
    <div class="dpick">${opts.map(([k,n])=>`<button style="${dvars(k)}" data-act="qdeck" data-v="${k}" aria-pressed="${k===quizDeck}"><i></i>${esc(n)}</button>`).join('')}</div>
    <button class="bigbtn" data-act="qstart">${ic('play')}Lancer le quiz</button>
    ${weak>=4?`<button class="bigbtn alt" data-act="quiz" data-v="weak">${ic('target')}Quiz sur mes ${weak} mots fragiles</button>`:''}`;
  }
  const q=quiz;
  if(q.i>=q.items.length){
    const miss=q.items.filter(it=>it.picked!==it.answer),pct=q.score/q.items.length;
    if(!q.celebrated&&pct>=.7){q.celebrated=true;setTimeout(confetti,120);}
    return `<section class="card-s done">
      <div class="ringwrap">${ring(pct,120,12,pct>=.7?'var(--good)':pct>=.4?'var(--mid)':'var(--bad)','var(--soft)')}<div class="ctr"><div><b class="mono" style="color:var(--ink)">${q.score}/${q.items.length}</b><span class="muted">bonnes</span></div></div></div>
      <h2>${pct===1?'Sans faute':pct>=.7?'Bien joué':'On continue'}</h2><p class="muted" style="margin:0">${esc(deckName(q.k))}</p>
      ${miss.length?`<div class="miss">${miss.map(it=>`<div><b>${esc(it.c.en)}</b><span>${esc(it.c.fr)}</span></div>`).join('')}</div>`:''}
      <button class="bigbtn" data-act="quiz" data-v="${q.k}">${ic('rotate')}Nouveau quiz</button>
      <button class="bigbtn alt" data-act="qquit">Changer de liste</button></section>`;
  }
  const it=q.items[q.i],style=ds(it.c.deck);
  return `<div class="sbar"><button class="xbtn" data-act="qquit" aria-label="Quitter le quiz">${ic('x')}</button><div class="prog"><span style="width:${q.i/q.items.length*100}%"></span></div><span class="scount">${q.i+1}/${q.items.length}</span></div>
  <section class="qcard" style="${dvars(it.c.deck)}">${ic(style.i,'wm')}
    <div class="fhead"><span class="tag"><i></i>${it.c.lvl===0?'Mes mots':LEVELS[it.c.lvl].name}</span><span class="tag">${it.dir==='en'?'En français ?':'En anglais ?'}</span></div>
    <div class="fbody"><div class="word${(it.dir==='en'?it.c.en:it.c.fr).length>20?' long':''}">${esc(it.dir==='en'?it.c.en:it.c.fr)}</div></div></section>
  <div class="opts">${it.options.map((o,k)=>{let cls='opt';if(it.picked!=null){if(k===it.answer)cls+=' right';if(k===it.picked)cls+=' picked'+(k!==it.answer?' wrong':'');}
    return `<button class="${cls}" data-act="qopt" data-v="${k}" id="opt${k}" ${it.picked!=null?'disabled':''}><span class="bub">${'ABCD'[k]}</span><span>${esc(o)}</span></button>`;}).join('')}</div>
  ${it.picked!=null&&it.c.ex?`<div class="ex" style="${dvars(it.c.deck)}">${esc(it.c.ex)}</div>`:''}
  ${it.picked!=null?`<button class="bigbtn" data-act="qnext">${q.i+1<q.items.length?'Question suivante':'Voir le résultat'}${ic('chev')}</button>`:''}`;
}
function answer(k){
  const it=quiz.items[quiz.i];if(it.picked!=null)return;it.picked=k;const t=dayNum(),c=it.c,prev=st(c);
  if(k===it.answer){quiz.score++;if(!prev)S.cards[c.id]=[1,t+1,0,1];}
  else{const n=prev?prev.slice():[0,t,0,0];n[0]=0;n[1]=t;n[2]=(n[2]||0)+1;n[3]=(n[3]||0)+1;S.cards[c.id]=n;}
  S.days[t]=(S.days[t]||0)+1;save();route.anim=false;render();route.anim=true;$('main').classList.remove('rise');
}

/* ---------- Stats ---------- */
function vStats(){
  const t=dayNum(),all=allCards();let acq=0,lrn=0,unseen=0;
  all.forEach(c=>{const s=st(c);if(!s)unseen++;else if(s[0]>=ACQUIRED)acq++;else lrn++;});
  const tomorrow=all.filter(c=>{const s=st(c);return s&&s[1]<=t+1;}).length;
  const total=Object.values(S.days).reduce((a,b)=>a+b,0);
  const days=[];for(let i=13;i>=0;i--)days.push({d:t-i,n:S.days[t-i]||0});const max=Math.max(5,...days.map(x=>x.n));
  const lv=[1,2,3].map(l=>{const cs=CARDS.filter(c=>c.lvl===l);return {l,n:cs.length,a:cs.filter(c=>status(c)==='s2').length};});
  const mA=MINE.cards.filter(c=>status(c)==='s2').length;
  const hard=all.filter(c=>{const s=st(c);return s&&s[2]>0;}).sort((a,b)=>st(b)[2]-st(a)[2]||st(a)[0]-st(b)[0]).slice(0,8);
  const wd=['D','L','M','M','J','V','S'];
  const lvRing=(p,col,name,sub)=>`<div><div class="ringwrap">${ring(p,64,8,col,'var(--soft)')}<div class="ctr"><b class="mono">${Math.round(p*100)}%</b></div></div><p>${name}<small>${sub}</small></p></div>`;
  return `<div class="sec-h" style="padding-top:8px"><h2 style="font-size:1.9rem">Progrès</h2></div>
  <section class="card-s sum"><div class="ringwrap">${ring(acq/all.length,96,11,'var(--accent)','var(--soft)')}<div class="ctr"><div><b class="mono" style="font-size:1.3rem">${acq}</b><span class="muted">acquis</span></div></div></div>
    <div><h2>${acq} mots sur ${all.length}</h2><p class="muted" style="margin:4px 0 0;font-size:.9rem">${lrn} en cours · ${unseen} jamais vus</p></div></section>
  <div class="sgrid">
    <div class="card-s stile"><span style="color:#FF7A1A">${ic('flame')}</span><b class="mono">${streak()}</b><span>jours d'affilée</span></div>
    <div class="card-s stile"><span style="color:var(--accent)">${ic('layers')}</span><b class="mono">${total}</b><span>cartes revues au total</span></div>
    <div class="card-s stile"><span style="color:var(--mid)">${ic('cal')}</span><b class="mono">${tomorrow}</b><span>prévues d'ici demain</span></div>
    <div class="card-s stile"><span style="color:var(--good)">${ic('target')}</span><b class="mono">${S.days[t]||0}/${S.settings.goal}</b><span>objectif du jour</span></div>
  </div>
  <section class="card-s rings">${lvRing(lv[0].a/lv[0].n,'var(--l1)','Bases','470–725')}${lvRing(lv[1].a/lv[1].n,'var(--l2)','Avancé','730–855')}${lvRing(lv[2].a/lv[2].n,'var(--l3)','Expert','860–990')}${lvRing(MINE.cards.length?mA/MINE.cards.length:0,'var(--sun)','Mes mots','Notion')}</section>
  <section class="card-s chartbox"><div class="sec-h" style="padding:0"><h2 style="font-size:1.05rem">Cartes revues</h2><span class="eyebrow">14 jours</span></div>
    <div class="chart">${days.map((x,i)=>`<div class="${x.n?'':'z'}${i===13?' t':''}" style="height:${x.n?Math.max(5,x.n/max*100):3}%">${x.n?`<b>${x.n}</b>`:''}</div>`).join('')}</div>
    <div class="chartx">${days.map(x=>`<span>${wd[new Date(x.d*86400000+43200000).getUTCDay()]}</span>`).join('')}</div></section>
  <div class="sec-h"><h2 style="font-size:1.1rem">Mots qui résistent</h2></div>
  ${hard.length?`<section class="card-s hard">${hard.map(c=>`<div><b>${esc(c.en)}</b><small>${esc(c.fr)}</small><em>${plural(st(c)[2],'erreur')}</em></div>`).join('')}</section>
    <button class="bigbtn alt" data-act="quiz" data-v="weak">${ic('target')}Quiz sur mes mots fragiles</button>`
  :`<div class="card-s note">Les mots où tu te trompes le plus apparaîtront ici après tes premières révisions.</div>`}`;
}

/* ---------- Settings ---------- */
function seg(act,cur,opts){return `<div class="seg">${opts.map(([v,l])=>`<button data-act="${act}" data-v="${v}" aria-pressed="${String(v)===String(cur)}">${l}</button>`).join('')}</div>`;}
function vSettings(){
  const standalone=(window.navigator.standalone===true)||matchMedia('(display-mode: standalone)').matches;
  const when=S.notionAt?new Date(S.notionAt).toLocaleDateString('fr-FR',{day:'numeric',month:'short'})+' à '+new Date(S.notionAt).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):NOTION_DATE;
  return `<div class="sec-h" style="padding-top:8px"><h2 style="font-size:1.9rem">Réglages</h2></div>
  <section class="card-s group">
    <div class="grow"><span class="gl"><span class="gi" style="background:#3B6CF6">${ic('swap')}</span>Sens des cartes</span>${seg('dir',S.settings.dir,[['en','EN→FR'],['fr','FR→EN'],['mix','Mixte']])}</div>
    <div class="grow"><span class="gl"><span class="gi" style="background:#14A06B">${ic('sparkle')}</span>Nouveaux mots / session</span>${seg('newper',S.settings.newPer,[[10,'10'],[15,'15'],[25,'25']])}</div>
    <div class="grow"><span class="gl"><span class="gi" style="background:#E39500">${ic('target')}</span>Objectif du jour</span>${seg('goal',S.settings.goal,[[10,'10'],[20,'20'],[40,'40']])}</div>
  </section>
  <section class="card-s group">
    <div class="grow"><span class="gl"><span class="gi" style="background:#7C5CE0">${ic('layers')}</span>Niveaux révisés</span></div>
    <div class="lvchips">${[1,2,3].map(l=>`<button class="lvc" style="--lc:var(--l${l})" data-act="lvl" data-v="${l}" aria-pressed="${S.settings.levels.includes(l)}"><i></i>${LEVELS[l].name}<small>${LEVELS[l].range}</small></button>`).join('')}</div>
  </section>
  <section class="card-s group">
    <div class="grow"><span class="gl"><span class="gi" style="background:#F5B700;color:#1E1A0A">${ic('bookmark')}</span>Mes mots Notion</span><span class="muted mono" style="font-size:.78rem">${MINE.cards.length} mots</span></div>
    ${IN_CLAUDE?`<p class="txt">${esc(notionMsg||('Dernière mise à jour : '+when))}</p><div style="padding:0 16px 14px"><button class="bigbtn alt" data-act="notion" id="notionBtn">${ic('rotate')}Mettre à jour depuis Notion</button></div>`
      :`<p class="txt">${esc(notionMsg||('Mots copiés le '+when+'.'))} Pour récupérer tes nouveaux mots, ouvre la version de Bulle dans Claude et touche « Mettre à jour depuis Notion ».</p>`}
  </section>
  <section class="card-s group">
    <div class="grow"><span class="gl"><span class="gi" style="background:#1AA3D9">${ic('home')}</span>Écran d'accueil</span>${standalone?'<span class="muted" style="font-size:.85rem">Installée</span>':''}</div>
    ${standalone?`<p class="txt">Bulle est installée sur ton téléphone. Ta progression reste enregistrée sur cet appareil.</p>`
      :`<ol class="steps"><li>Ouvre le lien de Bulle dans Safari.</li><li>Touche le bouton Partager.</li><li>Choisis « Sur l'écran d'accueil ».</li></ol>`}
  </section>
  <section class="card-s group">
    <div class="grow"><span class="gl"><span class="gi" style="background:#E5484D">${ic('trash')}</span>Remettre à zéro</span>
      ${resetAsk?`<span style="display:flex;gap:14px"><button class="linkbtn" data-act="reset-no">Annuler</button><button class="dangerbtn" data-act="reset-yes">Tout effacer</button></span>`:`<button class="dangerbtn" data-act="reset">Effacer ma progression</button>`}</div>
  </section>
  <p class="foot-note">${CARDS.length} mots TOEIC · ${DECKS.length} listes · ${MINE.cards.length} mots perso</p>`;
}

/* ---------- Notion sync ---------- */
function clean(v){if(v==null)return '';let s=typeof v==='string'?v:(Array.isArray(v)?v.join(', '):String(v));s=s.replace(/<br\s*\/?>/gi,' ').replace(/<[^>]+>/g,' ');const ta=document.createElement('textarea');ta.innerHTML=s;s=ta.value;return s.replace(/\\([$*_~`])/g,'$1').replace(/\s+/g,' ').trim();}
async function syncNotion(){
  const btn=$('notionBtn');if(btn)btn.disabled=true;notionMsg='Lecture de ta base Notion';render();
  try{
    const mcp=await window.claude.use('mcp');if(!mcp){notionMsg='Notion n\'est pas accessible depuis cette vue.';return;}
    const res=await mcp.callTool('Notion','notion-query-data-sources',{data:{mode:'rows',data_source_url:NOTION_DS,limit:100}});
    let p=res&&res.payload;if(p==null&&res&&Array.isArray(res.content)){const tb=res.content.find(b=>b&&b.type==='text');if(tb)p=tb.text;}
    if(typeof p==='string'){try{p=JSON.parse(p);}catch(e){}}
    const rows=p&&Array.isArray(p.results)?p.results:null;if(!rows)throw {code:'shape'};
    const list=rows.map(r=>[clean(r['Mot ou erreur']),clean(r['Traduction']),clean(r['Type']),clean(r['Exemple']),clean(r['Règle']||r['Correction ou règle'])]).filter(x=>x[0]);
    if(!list.length){notionMsg='Ta base Notion est vide pour l\'instant.';return;}
    S.notion=list;S.notionAt=Date.now();save();rebuildMine();notionMsg=`${plural(list.length,'mot')} à jour depuis Notion.`;
  }catch(e){const c=e&&e.code;
    notionMsg=c==='server_not_connected'?'Connecte Notion dans les réglages de claude.ai, rubrique Connecteurs.'
      :c==='not_in_manifest'||c==='approval_required'?'Accès à Notion refusé pour cette page. Réessaie et accepte la demande.'
      :c==='needs_reauth'?'Reconnecte Notion dans les réglages de claude.ai.'
      :'Synchro impossible pour le moment. Tes mots actuels sont conservés.';
  }finally{route.anim=false;render();route.anim=true;}
}

/* ---------- Events ---------- */
$('main').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act,v=b.dataset.v;
  switch(a){
    case 'home':go('home');break;
    case 'deck':go('deck',{k:v});break;
    case 'study':startSession(v);break;
    case 'flip':flip();break;
    case 'grade':grade(+v);break;
    case 'close':{const k=session&&session.k;go(k&&k!=='all'&&DECK_MAP[k]?'deck':'home',{k});break;}
    case 'quiz':quizDeck=(v&&v!=='weak')?v:quizDeck;startQuiz(v);break;
    case 'qdeck':quizDeck=v;quizMsg='';route.anim=false;render();route.anim=true;break;
    case 'qstart':startQuiz(quizDeck);break;
    case 'qopt':answer(+v);break;
    case 'qnext':quiz.i++;render();window.scrollTo(0,0);break;
    case 'qquit':quiz=null;go('quiz');break;
    case 'dir':S.settings.dir=v;save();route.anim=false;render();route.anim=true;break;
    case 'newper':S.settings.newPer=+v;save();route.anim=false;render();route.anim=true;break;
    case 'goal':S.settings.goal=+v;save();route.anim=false;render();route.anim=true;break;
    case 'lvl':{const l=+v,L=S.settings.levels;if(L.includes(l)){if(L.length===1)return;S.settings.levels=L.filter(x=>x!==l);}else S.settings.levels=L.concat(l).sort();save();route.anim=false;render();route.anim=true;break;}
    case 'notion':syncNotion();break;
    case 'reset':resetAsk=true;route.anim=false;render();route.anim=true;break;
    case 'reset-no':resetAsk=false;route.anim=false;render();route.anim=true;break;
    case 'reset-yes':{const keep={settings:S.settings,notion:S.notion,notionAt:S.notionAt};S=normalize(Object.assign(defaultState(),keep));resetAsk=false;save();go('home');break;}
  }
});
document.addEventListener('keydown',e=>{
  if(route.v!=='study'||!session||session.idx>=session.queue.length)return;
  if(!session.flipped&&(e.key===' '||e.key==='Enter')){e.preventDefault();flip();}
  else if(session.flipped&&['1','2','3'].includes(e.key))grade(+e.key-1);
  else if(session.flipped&&e.key==='ArrowRight')grade(2);else if(session.flipped&&e.key==='ArrowLeft')grade(0);
});

render();
initRemote();
</script>
